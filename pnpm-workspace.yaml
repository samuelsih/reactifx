packages:
  - packages/*

catalog:
  "@arethetypeswrong/core": 0.18.5
  "@babel/core": 8.0.6
  "@babel/types": 8.0.6
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  jsdom: 30.1.1
  oxfmt: 0.70.0
  oxlint: 1.85.0
  publint: 0.3.24
  react: 19.3.0
  react-dom: 19.3.0
  tsdown: 0.23.0
  typescript: 7.0.2
  vitest: 5.0.1

# Only install package versions published at least 7 days ago
# (7 * 24 * 60 minutes). Applies to transitive dependencies too.
minimumReleaseAge: 10080

# Save exact versions (no ^ or ~ prefix) when adding dependencies.
savePrefix: ""
