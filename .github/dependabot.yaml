version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@types/node"
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      babel:
        patterns:
          - "@babel/*"
          - babel-plugin-react-compiler
      vite:
        patterns:
          - vite
          - vitest
          - "@vitejs/*"
          - "@rolldown/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
